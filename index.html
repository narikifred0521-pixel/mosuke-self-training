<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d81e2c">
<meta name="description" content="MöSUKEの全種目を1人で練習できるアプリ。本番ルールで挑戦、成績表づくり、縮尺どおりの配置図。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>MöSUKE セルフ練習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@1,700;1,800;1,900&family=Noto+Sans+JP:wght@400;700;900&display=swap">
<style>
/* Layout: one-column phone tool in the MöSUKE system (overlay/rulebook): deep navy field, red+gold stripes, gold = target/clear, Barlow italic for numbers. */
:root{
  --bg:#0A1022; --panel:#18223F; --card:#202B4A; --line:#34406A; --fg:#F5F6FA; --mute:#8A93AB;
  --red:#E01F33; --red-deep:#7E1220; --gold:#F0B429; --ok:#1F9D63; --ng:#4A5575;
  --display:"Barlow","Arial Narrow",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* header band */
.band{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:#101A33;position:relative;
  padding:10px max(16px,env(safe-area-inset-left,0px)) 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(var(--red) 0 6px,transparent 6px 7px,var(--gold) 7px 10px)}
.band .brand{display:flex;align-items:center;gap:10px;min-width:0}
.band .brand img{width:48px;height:48px;flex:none}
.band .logo{font-family:var(--display);font-style:italic;font-weight:900;font-style:italic;font-weight:900;font-size:clamp(15px,4.6vw,24px);letter-spacing:.01em;line-height:1.05;white-space:nowrap}
.band .sub{font-size:13px;font-weight:900;color:var(--gold);letter-spacing:.08em;line-height:1.3}
.band button{font-size:13px;font-weight:700;padding:6px 12px;border:1.5px solid var(--fg);border-radius:999px;white-space:nowrap;flex:none}

h2{font-family:var(--body);font-weight:900;font-size:19px;letter-spacing:.02em;margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-left:4px solid var(--red);padding-left:10px;line-height:1.3}
h2 small{font-family:var(--body);font-size:12px;color:var(--mute);letter-spacing:.04em;font-weight:700}
.sec{display:flex;flex-direction:column;gap:10px}
.hint{color:var(--mute);font-size:13px;margin:0}

/* stage buttons */
.stages{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stbtn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.stbtn b{font-family:var(--display);font-style:italic;font-weight:900;font-size:22px;letter-spacing:.04em;line-height:1.1}
.stbtn span{font-size:12px;color:var(--mute)}
.stbtn.all{grid-column:1/-1;background:var(--red-deep);border-color:var(--red)}
.stbtn.all span{color:var(--fg);opacity:.8}

/* event list */
.evlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.evrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.evrow .code{font-family:var(--display);font-style:italic;font-weight:900;font-size:20px;color:var(--gold)}
.evrow .nm{font-weight:700;font-size:14px;line-height:1.3}
.evrow .nm em{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--mute)}
.rate{font-family:var(--display);font-style:italic;font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;text-align:right;min-width:52px}
.rate small{display:block;font-family:var(--body);font-size:10px;color:var(--mute)}
.stagehead{font-family:var(--display);font-style:italic;font-weight:900;font-size:13px;letter-spacing:.14em;color:var(--mute);padding:12px 4px 2px}

/* history */
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--panel);border-radius:4px;font-size:13px}
.hrow .res{font-weight:900}
.res.win{color:var(--gold)} .res.lose{color:var(--mute)}
.empty{color:var(--mute);font-size:13px;padding:10px;border:1px dashed var(--line);border-radius:6px}

/* play screen */
.play{display:flex;flex-direction:column;gap:14px;min-height:calc(100% - 60px)}
.evtitle{display:flex;flex-direction:column;gap:2px}
.evtitle .code{font-family:var(--display);font-style:italic;font-weight:900;font-size:17px;color:var(--gold);letter-spacing:.04em}
.evtitle .nm{font-size:22px;font-weight:900;line-height:1.25}
.evtitle .rule{font-size:13px;color:var(--mute)}
.steps{display:flex;gap:6px}
.step{flex:1;border:1px solid var(--line);border-radius:6px;padding:10px 4px;text-align:center;font-family:var(--display);font-style:italic;font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--mute)}
.step.cur{border-color:var(--fg);color:var(--fg);background:var(--panel)}
.step.done{background:var(--gold);border-color:var(--gold);color:#101A33}
.step small{display:block;font-family:var(--body);font-size:10px;font-weight:700}
.big{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(64px,22vw,120px);line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.biglabel{text-align:center;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.14em}
.misses{display:flex;justify-content:center;gap:10px;align-items:center}
.pip{width:18px;height:18px;border-radius:50%;border:2px solid var(--fg)}
.pip.used{background:var(--ng);border-color:var(--ng)}
.pip.last{border-color:var(--red)}
.misslabel{font-size:12px;color:var(--mute);font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.act{border-radius:8px;padding:22px 0;font-family:var(--display);font-style:italic;font-weight:900;font-size:34px;letter-spacing:.06em}
.act.clear{background:var(--gold);color:#101A33}
.act.miss{background:var(--panel);border:2px solid var(--red);color:var(--fg)}
.act:active{transform:scale(.98)}
.subacts{display:flex;justify-content:space-between;gap:8px}
.ghost{font-size:13px;font-weight:700;color:var(--mute);padding:8px 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tally div{background:var(--panel);border-radius:6px;padding:10px 4px}
.tally b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.tally span{font-size:11px;color:var(--mute);font-weight:700}
.streak{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:14px}
.dot.lg{width:22px;height:22px;border-radius:4px}
.dot.todo{background:transparent;border:2px solid var(--line)}
.dot.now{background:transparent;border:2px solid var(--fg)}
.sheetprog{height:6px;background:var(--panel);border-radius:3px;overflow:hidden}
.sheetprog div{height:100%;background:var(--red)}
.sheetset{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--mute)}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--fg);font-weight:700}
.chk input{width:18px;height:18px;accent-color:var(--red)}
.dot{width:10px;height:10px;border-radius:2px;background:var(--ng)}
.dot.c{background:var(--gold)}

/* final */
.timer{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(70px,24vw,128px);line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.timer.warn{color:var(--red)}
.score{display:flex;justify-content:center;align-items:baseline;gap:8px}
.score b{font-family:var(--display);font-style:italic;font-weight:900;font-size:56px;font-variant-numeric:tabular-nums;line-height:1}
.score span{font-family:var(--display);font-style:italic;font-weight:900;font-size:22px;color:var(--mute)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 0;font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;font-variant-numeric:tabular-nums}
.pad .m{grid-column:span 2;background:transparent;border:2px solid var(--ng);font-size:22px}
.pad .u{grid-column:span 2;font-family:var(--body);font-size:14px;font-weight:700;color:var(--mute)}
.pad button:disabled{opacity:.35}
.log{font-size:12px;color:var(--mute);text-align:center;min-height:18px;font-variant-numeric:tabular-nums}
.start{background:var(--red);border-radius:8px;padding:22px 0;font-family:var(--display);font-style:italic;font-weight:900;font-size:34px;letter-spacing:.08em;width:100%}
.goal{background:var(--gold);color:var(--bg);border-radius:50%;width:150px;height:150px;margin:0 auto;font-family:var(--display);font-style:italic;font-weight:900;font-size:34px;letter-spacing:.06em;display:block}

/* result overlay */
.result{display:flex;flex-direction:column;gap:14px;padding-top:24px;text-align:center}
.result .head{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(44px,14vw,72px);line-height:1.05;letter-spacing:.03em}
.result .head.win{color:var(--gold)}
.result p{margin:0;color:var(--mute)}
.btncol{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.btn{border-radius:8px;padding:14px;font-weight:900;font-size:16px;background:var(--panel);border:1px solid var(--line)}
.btn.pri{background:var(--red);border-color:var(--red)}
.summary{display:flex;flex-direction:column;gap:4px;text-align:left}
.summary div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--panel);border-radius:4px;font-size:13px}
.danger{color:var(--red);font-size:12px;font-weight:700;padding:6px 0;align-self:flex-start}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
/* 配置図 */
.figbtn{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:1.5px solid var(--gold);color:var(--gold);border-radius:999px;padding:5px 14px;font-weight:900;font-size:13px}
.figbtn svg{width:14px;height:14px}
.figlinks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mute);font-weight:700}
.figlinks .chip{font-size:13px;padding:4px 12px}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(5,5,6,.94);overflow-y:auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet .bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:520px;margin:0 auto 10px;font-weight:900}
.sheet .bar button{background:var(--fg);color:var(--bg);border-radius:999px;padding:8px 18px;font-weight:900;font-size:14px}
.lays{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.lay{background:#101A33;border-radius:8px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:6px;border-bottom:4px solid #e0202f;box-shadow:0 3px 0 #f0b429}
.lay svg{display:block;width:100%;height:auto}
.layhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-left:4px solid #e0202f;padding-left:10px}
.layhead b{font-family:var(--display);font-style:italic;font-weight:900;font-size:24px;color:#f0b429;font-style:italic}
.layhead span{font-weight:900;font-size:17px;color:#f4f4f6}
.layhead em{font-style:normal;margin-left:auto;background:#e0202f;color:#f4f4f6;font-weight:900;font-size:12px;padding:2px 8px;border-radius:4px}
.laynote{margin:0;background:#202B4A;color:#f0b429;font-weight:900;font-size:13px;padding:8px 10px;border-radius:6px;text-align:center}
.scale-note{margin:0;color:var(--mute);font-size:12px}
.share{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.share img.card{display:block;width:100%;border-radius:6px;background:#151d38;aspect-ratio:4/5}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--mute)}
.fld input,.fld textarea{font:inherit;font-size:15px;font-weight:400;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;width:100%}
.how{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.how li{counter-increment:s;display:flex;flex-direction:column;gap:6px;background:var(--panel);border-radius:8px;padding:12px}
.how li b::before{content:counter(s) "　";font-family:var(--display);font-style:italic;font-weight:900;color:var(--gold);font-size:18px}
.how .btn{display:block;text-align:center;text-decoration:none;color:var(--fg);width:100%}
.how .btn:disabled{opacity:.5}
.xbtn{background:var(--fg)!important;color:var(--bg)!important;border-color:var(--fg)!important}
.photoview{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.photoview img{max-width:100%;max-height:68vh;object-fit:contain;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;border-radius:4px}
.pv-tip{margin:0;color:#f4f4f6;text-align:center;font-size:18px;font-weight:700;line-height:1.5}
.pv-tip b{color:#f0b429}
.pv-tip small{font-size:13px;color:#9aa2bd;font-weight:700}
.pv-close{background:#f4f4f6;color:#0b0b0c;border-radius:999px;padding:12px 24px;font-weight:900;font-size:15px}
.sharesheet{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.cardwrap{margin:0;position:relative;display:flex;flex-direction:column;gap:8px}
.share img.card{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.cardwrap figcaption{background:var(--gold);color:#151d38;font-weight:900;font-size:14px;text-align:center;border-radius:8px;padding:10px 12px}
.cardwrap figcaption.flash{animation:flash .9s}
@keyframes flash{30%{transform:scale(1.04)}}
.txt summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--mute);padding:6px 0}
.txt[open]{display:flex;flex-direction:column;gap:8px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:11;display:grid;grid-template-columns:1fr auto;gap:8px;background:rgba(11,11,12,.96);border-top:1px solid var(--line);
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.savebar>*{max-width:100%}
.savebtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--gold);color:#151d38;border-radius:10px;padding:16px 12px;font-weight:900;font-size:18px;min-height:58px}
.savebtn .ic{font-size:22px;line-height:1}
.savebtn:disabled{opacity:.55}
.savebtn.done{background:var(--ok);color:#0b0b0c}
.savebtn.alt{background:var(--panel);color:var(--fg);border:1.5px solid var(--gold)}
.xopen{display:flex;align-items:center;justify-content:center;gap:4px;border:1.5px solid var(--fg);border-radius:10px;padding:0 16px;font-weight:900;font-size:15px;color:var(--fg);text-decoration:none;white-space:nowrap}
.xopen b{font-family:var(--display);font-style:italic;font-weight:900;font-size:20px}
.xopen.next{background:var(--fg);color:var(--bg)}
@media (prefers-reduced-motion:reduce){.cardwrap figcaption.flash{animation:none}}
.sharebtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--fg);border-radius:999px;padding:6px 14px;font-weight:900;font-size:13px;align-self:flex-start}
.sheet .nav{display:flex;justify-content:space-between;max-width:520px;margin:10px auto 0;gap:8px}
.sheet .nav button{flex:1;border:1px solid var(--line);border-radius:6px;padding:10px;font-weight:700;font-size:13px}
.sheet .nav button:disabled{opacity:.3}
@media (prefers-reduced-motion:no-preference){.act,.pad button{transition:transform .06s}}
</style>

<div class="wrap" id="app"></div>

<script>
// ===== ルール（出典：判定早見表 2026-09-24／1stミス3回 2026-09-27） =====
const STAGES=[
 {id:"1st",name:"1st STAGE",note:"1-1〜1-4は3つクリア・ミス3回まで／1-5はミス1回まで",events:[
  {code:"1-1",name:"ステップバイステップ",kind:"順手",targets:["4m","6m","8m"],miss:3,rule:"近い順に1本ずつ倒す"},
  {code:"1-2",name:"ウッドボーン",kind:"縦",targets:["3.5m","4m","4.5m"],miss:3,rule:"スキットル1本の太さ分の間隔で近い順"},
  {code:"1-3",name:"スローアンドジェントル",kind:"手前取り",targets:["4m","4.5m","5m"],miss:3,rule:"モルック棒1本分の間隔で近い順"},
  {code:"1-4",name:"パワークラッシュ",kind:"飛ばし",targets:["4→8m","5→9m","6→10m"],miss:3,rule:"ラインに少しでもかかればクリア"},
  {code:"1-5",name:"そりたつモル棒",kind:"ふわり",targets:["1本"],miss:1,rule:"手前に立てた棒を越えて倒す。棒に当たったらミス"}]},
 {id:"2nd",name:"2nd STAGE",note:"各種目1回クリア・ミス2回まで",events:[
  {code:"2-1",name:"ヘルトライアングル",kind:"縦ふわり",targets:["3.5m"],miss:2,rule:"逆三角形の奥2本の間にある狙いを倒す"},
  {code:"2-2",name:"ナッシングハップン",kind:"その場取り",targets:["4m"],miss:2,rule:"棒1本分の円にモルックとスキットルが両方入る"},
  {code:"2-3",name:"オーバーザウォール",kind:"束裏飛ばし",targets:["4.5→8m"],miss:2,rule:"3.5mの壁を越えて8mまで飛ばす。壁を倒したらミス"},
  {code:"2-4",name:"プレッシャーストレート",kind:"遠投",targets:["10m"],miss:2,rule:"1本倒す"}]},
 {id:"3rd",name:"3rd STAGE",note:"各種目ミス1回まで",events:[
  {code:"3-1",name:"デビルフック",kind:"曲げ",targets:["左","右"],miss:1,rule:"3本並び（4m）の真ん中だけを倒す。左右1回ずつ"},
  {code:"3-2",name:"デスエンド",kind:"遠投",targets:["12m"],miss:1,rule:"1本倒す"},
  {code:"3-3",name:"クレイジータイニーウッド",kind:"端引っ掛け",targets:["左","右"],miss:1,rule:"3.5mの陰から半分見える奥を倒す。左右1回ずつ"},
  {code:"3-4",name:"キャッチザレインボー",kind:"ふわり",targets:["7m"],miss:1,rule:"手前から2本分あけた奥を倒す"}]},
 {id:"final",name:"FINAL",note:"タイムアタック50（1分10秒）",events:[]}
];
const FINAL_SEC=70;
const ALL_EVENTS=STAGES.flatMap(s=>s.events.map(e=>({...e,stage:s.id})));
const evByCode=c=>ALL_EVENTS.find(e=>e.code===c);

// ===== 保存（この端末のブラウザだけ） =====
const KEY="mosuke_self_v1";
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&d.throws)return d}catch(e){}return{throws:[],runs:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
let DB=load();
function logThrow(code,target,ok,mode){DB.throws.push({t:Date.now(),code,target,ok,mode});save()}
function unlogThrow(){DB.throws.pop();save()}
function addRun(r){DB.runs.unshift({t:Date.now(),...r});DB.runs=DB.runs.slice(0,200);save()}
function stat(code,target){const a=DB.throws.filter(x=>x.code===code&&(target==null||x.target===target));const c=a.filter(x=>x.ok).length;return{n:a.length,c,rate:a.length?Math.round(c/a.length*100):null}}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ===== 本番モード =====
let RUN=null;
function startRun(which){
  keepAwake();
  const stages=which==="all"?STAGES.map(s=>s.id):[which];
  RUN={which,stages,si:0,ei:0,hist:[],log:[]};
  enterStage();
}
function curStage(){return STAGES.find(s=>s.id===RUN.stages[RUN.si])}
function enterStage(){const s=curStage();if(s.id==="final")return finalScreen();RUN.ei=0;enterEvent()}
function enterEvent(){RUN.ti=0;RUN.missed=0;RUN.undo=[];playScreen()}
function playScreen(){
  const s=curStage(),e=s.events[RUN.ei];
  const pips=Array.from({length:e.miss},(_,i)=>`<span class="pip ${i<RUN.missed?"used":""} ${i===e.miss-1&&i>=RUN.missed?"last":""}"></span>`).join("");
  const left=e.miss-RUN.missed;
  app.innerHTML=band(`<button data-quit>やめる</button>`)+`<div class="play">
    <div class="evtitle"><span class="code">${s.name}　${e.code}（${RUN.ei+1}/${s.events.length}）</span><span class="nm">${esc(e.name)}</span><span class="rule">${esc(e.kind)}｜${esc(e.rule)}</span></div>
    ${figBtn(e.code)}
    ${e.targets.length>1?`<div class="steps">${e.targets.map((t,i)=>`<div class="step ${i<RUN.ti?"done":i===RUN.ti?"cur":""}">${t}<small>${i<RUN.ti?"CLEAR":i===RUN.ti?"いまここ":""}</small></div>`).join("")}</div>`:""}
    <div><div class="biglabel">${e.targets.length>1?"狙い":"クリアで次へ"}</div><div class="big">${e.targets[RUN.ti]}</div></div>
    <div class="misses">${pips}<span class="misslabel">${left>0?`あと${left}回ミスOK`:"次のミスで失敗"}</span></div>
    <div class="actions"><button class="act miss" data-m>MISS</button><button class="act clear" data-c>CLEAR</button></div>
    <div class="subacts"><button class="ghost" data-undo ${RUN.undo.length?"":"disabled"}>↶ 1投もどす</button><span class="ghost">設置ミス・風はノーカウントで投げ直し</span></div>
  </div>`;
  app.querySelector("[data-c]").onclick=()=>throwRun(true);
  app.querySelector("[data-m]").onclick=()=>throwRun(false);
  app.querySelector("[data-undo]").onclick=()=>{const u=RUN.undo.pop();if(!u)return;RUN.ti=u.ti;RUN.missed=u.missed;unlogThrow();RUN.log.pop();playScreen()};
  app.querySelector("[data-quit]").onclick=()=>quitRun();
}
function throwRun(ok){
  const e=curStage().events[RUN.ei];
  RUN.undo.push({ti:RUN.ti,missed:RUN.missed});
  logThrow(e.code,e.targets[RUN.ti],ok,"run");RUN.log.push({code:e.code,ok});
  buzz(ok?30:[20,40,20]);
  if(ok){RUN.ti++;if(RUN.ti>=e.targets.length){RUN.hist.push({code:e.code,ok:true,misses:RUN.missed});return nextEvent()}}
  else{RUN.missed++;if(RUN.missed>e.miss){RUN.hist.push({code:e.code,ok:false,misses:RUN.missed});return eventFailed(e)}}
  playScreen();
}
function nextEvent(){
  const s=curStage();RUN.ei++;
  if(RUN.ei<s.events.length)return enterEvent();
  if(RUN.si<RUN.stages.length-1){return resultScreen({head:`${s.name}<br>CLEAR`,win:true,msg:"次のステージへ進みます。",btns:[["次へ："+STAGES.find(x=>x.id===RUN.stages[RUN.si+1]).name,()=>{RUN.si++;enterStage()},true],["ここで終える",()=>finishRun(`${s.name} クリア`,true)]]})}
  finishRun(`${s.name} クリア`,true,true);
}
function eventFailed(e){
  const s=curStage();
  resultScreen({head:"そこまで！",win:false,msg:`${e.code} ${e.name}で失敗。本番なら${s.name}敗退です。`,btns:[
    ["敗退として記録して終える",()=>finishRun(`${e.code}で敗退`,false),true],
    ["この種目をもう一度",()=>{enterEvent()}],
    ["練習として次の種目へ",()=>{RUN.practiceOn=true;nextEvent()}]]});
}
function quitRun(){
  const s=curStage(),e=s.events[RUN.ei];
  resultScreen({head:"中断",win:false,msg:"ここまでの投げは成功率に残ります。",btns:[["中断として記録して戻る",()=>finishRun(`${e?e.code:s.name}で中断`,false),true],["続ける",()=>s.id==="final"?finalScreen(true):playScreen()]]});
}
function finishRun(result,win,showSummary){
  const label=RUN.which==="all"?"全ステージ通し":STAGES.find(s=>s.id===RUN.which).name;
  addRun({label,result:result+(RUN.practiceOn?"（練習続行あり）":""),win:win&&!RUN.practiceOn});
  const sum=RUN.hist.map(h=>{const e=evByCode(h.code);return`<div><span>${h.code} ${esc(e.name)}</span><span>${h.ok?"CLEAR":"失敗"}・ミス${h.misses}</span></div>`}).join("");
  const n=RUN.log.length,c=RUN.log.filter(x=>x.ok).length;
  const card={kind:"run",label,head:(win?result.replace(" クリア"," CLEAR"):result)+(RUN.practiceOn?"（練習続行）":""),win:win&&!RUN.practiceOn,n,c,hist:RUN.hist.slice()};
  resultScreen({head:win?result.replace(" ","<br>"):"おつかれさま",win,msg:`${n}投・成功${c}（${n?Math.round(c/n*100):0}%）`,extra:sum?`<div class="summary">${sum}</div>`:"",btns:[["ホームへ",home,true],["成績表をXで共有",()=>openShare(card)]]});
  RUN=null;
}
function resultScreen({head,win,msg,btns,extra}){
  stopTimer();
  app.innerHTML=band()+`<div class="result"><div class="head ${win?"win":""}">${head}</div><p>${esc(msg)}</p>${extra||""}<div class="btncol">${btns.map((b,i)=>`<button class="btn ${b[2]?"pri":""}" data-b="${i}">${esc(b[0])}</button>`).join("")}</div></div>`;
  btns.forEach((b,i)=>app.querySelector(`[data-b="${i}"]`).onclick=b[1]);
  window.scrollTo(0,0);
}

// ===== FINAL：タイムアタック50 =====
let FIN=null;
function finalScreen(resume){
  if(!resume||!FIN)FIN={state:"ready",score:0,consec:0,start:0,end:0,hist:[],reached:0};
  if(!RUN){RUN={which:"final",stages:["final"],si:0,hist:[],log:[]}}
  drawFinal();

function remain(){const now=FIN.state==="done"?FIN.end:Date.now();return Math.max(0,FINAL_SEC*1000-(now-FIN.start))}
function fmtT(ms){const s=ms/1000;return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}.${Math.floor(ms%1000/100)}`}
function drawFinal(){
  const st=FIN.state;
  const pips=[0,1,2].map(i=>`<span class="pip ${i<FIN.consec?"used":""}"></span>`).join("");
  let body="";
  if(st==="ready")body=`<p class="hint">初期配置：3.5mに12本（通常の試合と同じ）。<br>50点ちょうどでゴール。超えたら25点。3回連続ミス・1分10秒超えで失格。</p><button class="start" data-start>START</button>`;
  else if(st==="run")body=`<div class="pad">${Array.from({length:12},(_,i)=>`<button data-p="${i+1}">${i+1}</button>`).join("")}<button class="m" data-p="0">MISS</button><button class="u" data-undo ${FIN.hist.length?"":"disabled"}>↶ 1投もどす</button></div>`;
  else if(st==="goal")body=`<p class="hint" style="text-align:center">50点！ スキットルを初期配置に戻して、モルッカーリに戻ったらタップ。</p><button class="goal" data-goal>GOAL</button>`;
  app.innerHTML=band(`<button data-quit>やめる</button>`)+`<div class="play">
    <div class="evtitle"><span class="code">FINAL</span><span class="nm">タイムアタック50</span></div>
    ${st==="ready"?figBtn("final"):""}
    <div><div class="timer" id="tm">${fmtT(st==="ready"?FINAL_SEC*1000:remain())}</div><div class="biglabel">残り時間</div></div>
    <div class="score"><b>${FIN.score}</b><span>/ 50</span></div>
    <div class="misses">${pips}<span class="misslabel">連続ミス ${FIN.consec}/3</span></div>
    <div class="log">${FIN.hist.map(h=>h.p===0?"×":h.p).join(" ・ ")}${FIN.lastNote?`　${FIN.lastNote}`:""}</div>
    ${body}</div>`;
  const q=s=>app.querySelector(s);
  q("[data-quit]").onclick=()=>{if(FIN.state==="ready"){if(RUN&&RUN.sheet){RUN=null;FIN=null;SHEET.final={skip:true};return sheetResult()}RUN=null;FIN=null;home()}else quitFinal()};
  if(st==="ready")q("[data-start]").onclick=()=>{keepAwake();FIN.state="run";FIN.start=Date.now();tick();timerId=setInterval(tick,100);drawFinal();buzz(60)};
  if(st==="run"){app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>finThrow(+b.dataset.p));q("[data-undo]").onclick=finUndo}
  if(st==="goal")q("[data-goal]").onclick=()=>{FIN.end=Date.now();FIN.state="done";stopTimer();finFinish(true)};
}
function tick(){const r=remain();const el=document.getElementById("tm");if(el){el.textContent=fmtT(r);el.classList.toggle("warn",r<=10000)}
  if(r<=0&&(FIN.state==="run"||FIN.state==="goal")){FIN.end=FIN.start+FINAL_SEC*1000;FIN.state="done";stopTimer();buzz([100,60,100]);finFinish(false,"時間切れ")}}
function finThrow(p){
  FIN.hist.push({p,prev:FIN.score,consec:FIN.consec});FIN.lastNote="";
  logThrow("FINAL",String(p),p>0,"run");RUN.log.push({code:"FINAL",ok:p>0});
  if(p===0){FIN.consec++;buzz([20,40,20]);if(FIN.consec>=3){FIN.end=Date.now();FIN.state="done";stopTimer();return finFinish(false,"3回連続ミス")}}
  else{FIN.consec=0;FIN.score+=p;buzz(30);if(FIN.score>50){FIN.score=25;FIN.lastNote="50超え→25点"}if(FIN.score===50){FIN.state="goal";FIN.reached=Date.now()}}
  drawFinal();
}
function finUndo(){const h=FIN.hist.pop();if(!h)return;FIN.score=h.prev;FIN.consec=h.consec;FIN.lastNote="";unlogThrow();RUN.log.pop();drawFinal()}
function quitFinal(){const was=FIN.state;stopTimer();
  resultScreen({head:"中断",win:false,msg:"タイマーは止まりません。続けるなら「続ける」を押してください。",btns:[["中断として記録して戻る",()=>{FIN=null;if(RUN&&RUN.sheet){RUN=null;SHEET.final={skip:true};return sheetResult()}finishRun("FINALで中断",false)},true],["続ける",()=>{if(was==="run"||was==="goal")timerId=setInterval(tick,100);drawFinal();tick()}]]});
}
function finFinish(win,why){
  const t=((FIN.end-FIN.start)/1000).toFixed(1);
  if(RUN&&RUN.sheet){DB.finals=DB.finals||[];DB.finals.push({t:Date.now(),win,time:win?+t:null});SHEET.final=win?{win:true,time:+t}:{win:false,why};FIN=null;RUN=null;return sheetResult()}
  RUN.hist.push({code:"FINAL",ok:win,misses:FIN.hist.filter(h=>h.p===0).length,time:win?t:null});
  const n=FIN.hist.length;
  FIN=null;
  DB.finals=DB.finals||[];DB.finals.push({t:Date.now(),win,time:win?+t:null});save();
  const label=RUN.which==="all"?"全ステージ通し":"FINAL";
  const card={kind:"run",label,head:win?(RUN.which==="all"?(RUN.practiceOn?"FINAL CLEAR（練習続行）":"完全制覇"):"FINAL CLEAR"):`FINAL失格（${why}）`,win:win&&!RUN.practiceOn,n:RUN.log.length,c:RUN.log.filter(x=>x.ok).length,hist:RUN.hist.slice(),time:win?t:null};
  if(win){addRun({label:RUN.which==="all"?"全ステージ通し":"FINAL",result:(RUN.which==="all"?"完全制覇 ":"FINALクリア ")+t+"秒",win:!RUN.practiceOn});
    const head=RUN.which==="all"?"完全制覇":"FINAL<br>CLEAR";RUN=null;
    return resultScreen({head,win:true,msg:`タイム ${t}秒・${n}投`,btns:[["もう一度FINAL",()=>startRun("final"),true],["成績表をXで共有",()=>openShare(card)],["ホームへ",home]]})}
  addRun({label:RUN.which==="all"?"全ステージ通し":"FINAL",result:`FINAL失格（${why}）`,win:false});RUN=null;
  resultScreen({head:"失格",win:false,msg:`${why}・${n}投`,btns:[["もう一度FINAL",()=>startRun("final"),true],["成績表をXで共有",()=>openShare(card)],["ホームへ",home]]});
}

// ===== 成績表作成モード（全13種目を同じ数ずつ投げる） =====
let SHEET=null;
const SHEET_PREF_KEY="mosuke_sheet_pref";
function sheetPref(){try{const v=JSON.parse(localStorage.getItem(SHEET_PREF_KEY)||"null");if(v&&[3,5,10].includes(v.per))return v}catch(e){}return{per:5,final:true}}
function setSheetPref(v){try{localStorage.setItem(SHEET_PREF_KEY,JSON.stringify(v))}catch(e){}}
function saveDraft(){DB.sheetDraft=SHEET;save()}
function startSheet(per,withFinal){keepAwake();SHEET={per,withFinal,t:Date.now(),ei:0,res:ALL_EVENTS.map(e=>({code:e.code,log:[],skip:false})),final:null};saveDraft();sheetScreen()}
function resumeSheet(){SHEET=DB.sheetDraft;if(!SHEET)return home();keepAwake();if(SHEET.ei>=ALL_EVENTS.length)return sheetAfterEvents();sheetScreen()}
// 距離・左右が複数ある種目は、1投ごとに順番に回す（1-1なら 4m→6m→8m→4m…）
const sheetTarget=(e,i)=>e.targets[i%e.targets.length];
function sheetScreen(){
  const e=ALL_EVENTS[SHEET.ei],r=SHEET.res[SHEET.ei],i=r.log.length;
  const done=SHEET.res.reduce((a,x)=>a+x.log.length,0),total=ALL_EVENTS.length*SHEET.per;
  const c=r.log.filter(x=>x.ok).length;
  app.innerHTML=band(`<button data-quit>中断</button>`)+`<div class="play">
    <div class="sheetprog" aria-label="全体の進み ${done}/${total}投"><div style="width:${done/total*100}%"></div></div>
    <div class="evtitle"><span class="code">成績表　${e.code}（${SHEET.ei+1}/${ALL_EVENTS.length}種目）</span><span class="nm">${esc(e.name)}</span><span class="rule">${esc(e.kind)}｜${esc(e.rule)}</span></div>
    ${figBtn(e.code)}
    <div><div class="biglabel">${i+1}投目 / ${SHEET.per}投　狙い</div><div class="big">${sheetTarget(e,i)}</div></div>
    <div class="streak">${Array.from({length:SHEET.per},(_,k)=>`<span class="dot lg ${k<i?(r.log[k].ok?"c":""):k===i?"now":"todo"}"></span>`).join("")}</div>
    <div class="misslabel" style="text-align:center">この種目 ${c}/${i}　全体 ${done}/${total}投</div>
    <div class="actions"><button class="act miss" data-m>MISS</button><button class="act clear" data-c>CLEAR</button></div>
    <div class="subacts"><button class="ghost" data-undo ${done||SHEET.ei?"":"disabled"}>↶ 1投もどす</button><button class="ghost" data-skip>この種目をとばす</button></div>
  </div>`;
  const q=s=>app.querySelector(s);
  q("[data-c]").onclick=()=>sheetThrow(true);
  q("[data-m]").onclick=()=>sheetThrow(false);
  q("[data-undo]").onclick=sheetUndo;
  q("[data-skip]").onclick=()=>{r.skip=true;r.log.forEach(()=>unlogThrow());r.log=[];sheetNext()};
  q("[data-quit]").onclick=()=>resultScreen({head:"中断",win:false,msg:"ここまでの投げは保存してあります。ホームの「続きから」で再開できます。",btns:[
    ["続ける",sheetScreen,true],["ホームへ（あとで続ける）",home],["ここまでで成績表を出す",()=>sheetResult(true)],["この成績表をやめる",()=>{SHEET=null;DB.sheetDraft=null;save();home()}]]});
}
function sheetThrow(ok){
  const e=ALL_EVENTS[SHEET.ei],r=SHEET.res[SHEET.ei],t=sheetTarget(e,r.log.length);
  r.log.push({target:t,ok});logThrow(e.code,t,ok,"sheet");buzz(ok?30:[20,40,20]);
  if(r.log.length>=SHEET.per)return sheetNext();
  saveDraft();sheetScreen();
}
function sheetNext(){SHEET.ei++;saveDraft();if(SHEET.ei>=ALL_EVENTS.length)return sheetAfterEvents();sheetScreen()}
function sheetUndo(){
  let r=SHEET.res[Math.min(SHEET.ei,ALL_EVENTS.length-1)];
  if(SHEET.ei>=ALL_EVENTS.length||!r.log.length){if(SHEET.ei===0)return;SHEET.ei--;r=SHEET.res[SHEET.ei];if(r.skip){r.skip=false;saveDraft();return sheetScreen()}}
  if(r.log.length){r.log.pop();unlogThrow()}
  saveDraft();sheetScreen();
}
function sheetAfterEvents(){
  if(!SHEET.withFinal)return sheetResult();
  resultScreen({head:"13種目<br>おわり",win:true,msg:"最後にFINAL（タイムアタック50）を1回。初期配置に並べてからスタートしてください。",btns:[
    ["FINALへ",()=>{RUN={which:"final",sheet:true,stages:["final"],si:0,hist:[],log:[]};FIN=null;finalScreen()},true],
    ["FINALはとばして成績表を出す",()=>{SHEET.final={skip:true};sheetResult()}],
    ["↶ 最後の1投をもどす",sheetUndo]]});
}
function sheetCard(){
  const rows=ALL_EVENTS.map((e,i)=>{const r=SHEET.res[i],c=r.log.filter(x=>x.ok).length;return{code:e.code,name:e.name,n:r.log.length,c,rate:r.log.length?c/r.log.length:null,skip:r.skip}});
  const n=rows.reduce((a,r)=>a+r.n,0),c=rows.reduce((a,r)=>a+r.c,0);
  return{kind:"stats",mode:"sheet",per:SHEET.per,rows,n,c,best:null,final:SHEET.final};
}
function sheetResult(partial){
  const card=sheetCard(),per=SHEET.per,p=pct(card.c,card.n);
  DB.sheets=DB.sheets||[];
  const prev=DB.sheets.filter(x=>x.per===per).slice(-1)[0];
  DB.sheets.push({t:Date.now(),per,n:card.n,c:card.c,final:card.final,partial:!!partial});
  const fin=card.final&&!card.final.skip?(card.final.win?`・FINAL ${card.final.time.toFixed(1)}秒`:"・FINAL失格"):"";
  addRun({label:`成績表（各${per}投）`,result:`${card.c}/${card.n}（${p}%）${fin}${partial?"・途中まで":""}`,win:false});
  SHEET=null;DB.sheetDraft=null;save();
  const sum=card.rows.map(r=>`<div><span>${r.code} ${esc(r.name)}</span><span>${r.n?`${r.c}/${r.n}（${pct(r.c,r.n)}%）`:"とばし"}</span></div>`).join("");
  resultScreen({head:`${p}%`,win:true,msg:`成績表（各${per}投）　${card.c}/${card.n}投 成功${fin}${prev&&!partial?`　前回 ${pct(prev.c,prev.n)}%`:""}`,extra:`<div class="summary">${sum}</div>`,
    btns:[["成績表をXで共有",()=>openShare(card),true],["ホームへ",home]]});
}

// ===== 種目練習モード =====
function practice(code){
  keepAwake();
  const e=evByCode(code);
  const P={code,ti:0,session:[]};
  const draw=()=>{
    const t=e.targets[P.ti],st=stat(code,t),ss=P.session.filter(x=>x.target===t),sc=ss.filter(x=>x.ok).length;
    app.innerHTML=band(`<button data-back>もどる</button>`)+`<div class="play">
      <div class="evtitle"><span class="code">${e.code}　種目練習</span><span class="nm">${esc(e.name)}</span><span class="rule">${esc(e.kind)}｜${esc(e.rule)}</span></div>
      ${figBtn(e.code)}
      ${e.targets.length>1?`<div class="chips">${e.targets.map((x,i)=>`<button class="chip" aria-pressed="${i===P.ti}" data-t="${i}">${x}</button>`).join("")}</div>`:""}
      <div class="big">${t}</div>
      <div class="tally"><div><b>${sc}/${ss.length}</b><span>今日</span></div><div><b>${ss.length?Math.round(sc/ss.length*100)+"%":"—"}</b><span>今日の成功率</span></div><div><b>${st.rate==null?"—":st.rate+"%"}</b><span>通算（${st.n}投）</span></div></div>
      <div class="streak">${ss.slice(-30).map(x=>`<span class="dot ${x.ok?"c":""}"></span>`).join("")}</div>
      <div class="actions"><button class="act miss" data-m>MISS</button><button class="act clear" data-c>CLEAR</button></div>
      <div class="subacts"><button class="ghost" data-undo ${P.session.length?"":"disabled"}>↶ 1投もどす</button>${P.session.length?`<button class="sharebtn" data-share>成績表をXで共有</button>`:`<span class="ghost">ミス上限なし</span>`}</div></div>`;
    const q=s=>app.querySelector(s);
    q("[data-back]").onclick=()=>{if(P.session.length){const c=P.session.filter(x=>x.ok).length;addRun({label:`${e.code} 種目練習`,result:`${c}/${P.session.length}（${Math.round(c/P.session.length*100)}%）`,win:false})}home()};
    q("[data-c]").onclick=()=>{P.session.push({target:t,ok:true});logThrow(code,t,true,"practice");buzz(30);draw()};
    q("[data-m]").onclick=()=>{P.session.push({target:t,ok:false});logThrow(code,t,false,"practice");buzz([20,40,20]);draw()};
    q("[data-undo]").onclick=()=>{if(!P.session.length)return;P.session.pop();unlogThrow();draw()};
    app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{P.ti=+b.dataset.t;draw()});
    const sh=q("[data-share]");if(sh)sh.onclick=()=>openShare({kind:"practice",code:e.code,name:e.name,targets:e.targets,session:P.session.slice()});
  };
  draw();window.scrollTo(0,0);
}

home();
</script>
